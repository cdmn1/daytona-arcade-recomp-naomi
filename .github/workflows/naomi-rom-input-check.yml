name: Naomi ROM input check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check required private inputs
        env:
          ROM_URL: ${{ secrets.DAYTONA93_DROPBOX_URL }}
          EXTRA_ROM_URL: ${{ secrets.DAYTONAZIP_DROPBOX_URL }}
          MUSIC_URL: ${{ secrets.DAYTONA_MUSIC_DROPBOX_URL }}
        run: |
          set -euo pipefail
          if [ -z "$ROM_URL" ]; then
            echo "::error::Add the DAYTONA93_DROPBOX_URL repository secret before running this workflow."
            exit 1
          fi
          if [ -z "$EXTRA_ROM_URL" ]; then
            echo "::error::Add the DAYTONAZIP_DROPBOX_URL repository secret before running this workflow."
            exit 1
          fi
          if [ -z "$MUSIC_URL" ]; then
            echo "::error::Add the DAYTONA_MUSIC_DROPBOX_URL repository secret before running this workflow."
            exit 1
          fi
          echo "All three private download secrets are configured."

      - name: Download Daytona ROM archive
        env:
          ROM_URL: ${{ secrets.DAYTONA93_DROPBOX_URL }}
        run: |
          set -euo pipefail
          mkdir -p input
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            --output input/daytona93.zip "$ROM_URL"
          test -s input/daytona93.zip
          unzip -tq input/daytona93.zip
          echo "ROM archive downloaded and ZIP integrity verified."
          echo "Archive size: $(stat -c '%s bytes' input/daytona93.zip)"
          echo "Archive entries:"
          unzip -Z1 input/daytona93.zip | sed -n '1,100p'
          echo "Checking for Daytona ROM program and data entries..."
          unzip -Z1 input/daytona93.zip | grep -Eiq '(^|/)(epr-|mpr-).*(\.bin|\.ic[0-9]+|\.rom)$' || {
            echo "::error::No expected epr-/mpr- ROM entries found in daytona93.zip"
            exit 1
          }
      - name: Download supplementary Daytona ROM archive
        env:
          EXTRA_ROM_URL: ${{ secrets.DAYTONAZIP_DROPBOX_URL }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            --output input/daytona-extra.zip "$EXTRA_ROM_URL"
          test -s input/daytona-extra.zip
          unzip -tq input/daytona-extra.zip
          echo "Supplementary ROM archive downloaded and ZIP integrity verified."
          echo "Archive size: $(stat -c '%s bytes' input/daytona-extra.zip)"
          unzip -Z1 input/daytona-extra.zip | sed -n '1,100p'
          echo "Checking required sound ROMs across both ROM archives..."
          for stem in epr-16720 epr-16721 mpr-16491 mpr-16492 mpr-16493 mpr-16494; do
            if ! { unzip -Z1 input/daytona93.zip; unzip -Z1 input/daytona-extra.zip; } | grep -Eiq "(^|/)$stem([.]|$)"; then
              echo "::error::Missing required sound ROM: $stem (checked both archives)"
              exit 1
            fi
          done
          echo "All six required sound ROMs are present across the two archives."

      - name: Download and validate music archive
        env:
          MUSIC_URL: ${{ secrets.DAYTONA_MUSIC_DROPBOX_URL }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            --output input/daytona-music.zip "$MUSIC_URL"
          test -s input/daytona-music.zip
          unzip -tq input/daytona-music.zip
          echo "Music archive downloaded and ZIP integrity verified."
          echo "Archive size: $(stat -c '%s bytes' input/daytona-music.zip)"
          unzip -Z1 input/daytona-music.zip | sed -n '1,80p'

      - name: Confirm private input handling
        run: |
          echo "Archives were downloaded only onto this ephemeral runner."
          echo "No ROM or music archive is committed or uploaded as a workflow artifact."
