name: Build Daytona USA Naomi NetDIMM image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naomi-full-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-naomi:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out Daytona project
        uses: actions/checkout@v4

      - name: Check required private inputs and artifact passphrase
        env:
          ROM_URL: ${{ secrets.DAYTONA93_DROPBOX_URL }}
          EXTRA_ROM_URL: ${{ secrets.DAYTONAZIP_DROPBOX_URL }}
          MUSIC_URL: ${{ secrets.DAYTONA_MUSIC_DROPBOX_URL }}
          ARTIFACT_PASSWORD: ${{ secrets.NAOMI_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ROM_URL" || { echo "::error::Missing DAYTONA93_DROPBOX_URL"; exit 1; }
          test -n "$EXTRA_ROM_URL" || { echo "::error::Missing DAYTONAZIP_DROPBOX_URL"; exit 1; }
          test -n "$MUSIC_URL" || { echo "::error::Missing DAYTONA_MUSIC_DROPBOX_URL"; exit 1; }
          test "${#ARTIFACT_PASSWORD}" -ge 16 || {
            echo "::error::Add NAOMI_ARTIFACT_PASSWORD as a repository secret (at least 16 characters)."
            exit 1
          }
          echo "All required secrets are configured."

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake ninja-build zsh \
            bison flex texinfo gettext \
            libjpeg-dev libpng-dev libelf-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxtst-dev \
            libxi-dev libxss-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            zlib1g-dev libncurses-dev pkg-config \
            git subversion python3 python3-numpy python3-pil python3-cryptography \
            wget curl unzip

      - name: Restore SH-4 toolchain cache
        uses: actions/cache@v4
        with:
          path: .toolchain/sh-elf
          key: sh-elf-gcc15-stable-${{ runner.os }}-naomi-v1

      - name: Check out KallistiOS
        uses: actions/checkout@v4
        with:
          repository: KallistiOS/KallistiOS
          ref: master
          path: KallistiOS

      - name: Build SH-4 toolchain if cache is empty
        env:
          KOS_BASE: ${{ github.workspace }}/KallistiOS
          KOS_CC_BASE: ${{ github.workspace }}/.toolchain/sh-elf
        run: |
          set -euo pipefail
          mkdir -p "$KOS_CC_BASE"
          if [ ! -x "$KOS_CC_BASE/bin/sh-elf-gcc" ]; then
            cp "$KOS_BASE/utils/kos-chain/Makefile.dreamcast.cfg" \
               "$KOS_BASE/utils/kos-chain/Makefile.cfg"
            sed -i \
              -e "s|^toolchain_path=.*|toolchain_path=$KOS_CC_BASE|" \
              -e 's|^makejobs=.*|makejobs=4|' \
              -e 's|^enable_objc=.*|enable_objc=0|' \
              -e 's|^enable_objcpp=.*|enable_objcpp=0|' \
              -e 's|^precision_modes=.*|precision_modes=m4-single|' \
              "$KOS_BASE/utils/kos-chain/Makefile.cfg"
            make -C "$KOS_BASE/utils/kos-chain"
          fi

      - name: Configure Naomi KOS environment and build KOS
        env:
          KOS_BASE: ${{ github.workspace }}/KallistiOS
        run: |
          set -eo pipefail
          cat > "$KOS_BASE/environ.sh" <<'EOF'
          export KOS_TOOLCHAIN="gcc"
          export KOS_ARCH="dreamcast"
          export KOS_SUBARCH="naomi"
          export KOS_BASE="${GITHUB_WORKSPACE}/KallistiOS"
          export KOS_PORTS="${GITHUB_WORKSPACE}/kos-ports"
          export KOS_CC_BASE="${GITHUB_WORKSPACE}/.toolchain/sh-elf"
          export KOS_CC_PREFIX="sh-elf"
          export DC_ARM_BASE="${GITHUB_WORKSPACE}/.toolchain/arm-eabi"
          export DC_ARM_PREFIX="arm-eabi"
          export DC_TOOLS_BASE="${GITHUB_WORKSPACE}/.toolchain/bin"
          export KOS_GENROMFS="${KOS_BASE}/utils/genromfs/genromfs"
          export KOS_CMAKE_TOOLCHAIN="${KOS_BASE}/utils/cmake/kallistios.toolchain.cmake"
          export KOS_MAKE="make"
          export KOS_CFLAGS="-O2 -fno-PIC -fno-PIE -fomit-frame-pointer"
          export KOS_SH4_PRECISION="-m4-single"
          . "${KOS_BASE}/env/environ_base.sh"
          EOF
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["KOS_BASE"]) / "kernel/arch/dreamcast/hardware/maple/mie/mie.c"
          s = p.read_text()
          replacements = (
              ("bool mie_init_fw(const char *fw_path) {", "    if(hardware_sys_mode(NULL) == HW_TYPE_RETAIL) {\n        return false;\n    }\n\n"),
              ("void mie_init(void) {", "    if(hardware_sys_mode(NULL) == HW_TYPE_RETAIL) {\n        return;\n    }\n\n"),
          )
          for function, guard in replacements:
              start = s.find(function)
              if start < 0:
                  raise SystemExit(f"Could not find {function}")
              guard_at = s.find(guard, start + len(function))
              if guard_at < 0:
                  raise SystemExit(f"Could not find Retail guard in {function}")
              s = s[:guard_at] + s[guard_at + len(guard):]
          p.write_text(s)
          PY
          make -C "$KOS_BASE" -j2

      - name: Build Naomi zlib port
        env:
          KOS_BASE: ${{ github.workspace }}/KallistiOS
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          git clone --depth 1 https://github.com/KallistiOS/kos-ports.git "$KOS_PORTS"
          # kos-ports currently points at the HTTP root, which returns an error
          # page for this release. Pre-fetch the official HTTPS fossils archive;
          # the port's distinfo validation still verifies its checksum.
          mkdir -p "$KOS_PORTS/zlib/dist"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 180 \
            --output "$KOS_PORTS/zlib/dist/zlib-1.3.2.tar.gz" \
            https://zlib.net/fossils/zlib-1.3.2.tar.gz
          make -C "$KOS_PORTS/zlib" install
          # kos-ports installs headers under include/zlib and the port's
          # private inst directory, not directly in include/.
          test -s "$KOS_PORTS/zlib/inst/include/zlib.h"
          test -s "$KOS_PORTS/zlib/inst/lib/libz.a"
          test -s "$KOS_PORTS/include/zlib/zlib.h"
          test -s "$KOS_PORTS/lib/libz.a"

      - name: Fetch pinned enDjinn and AICAflow dependencies
        run: |
          set -euo pipefail
          sh platform/dreamcast-native/scripts/fetch_endjinn.sh
          sh platform/dreamcast-native/scripts/fetch_aicaflow.sh

      - name: Build pinned SH4ZAM library
        env:
          KOS_BASE: ${{ github.workspace }}/KallistiOS
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          sh platform/dreamcast-native/scripts/fetch_sh4zam.sh

      - name: Download private ROM and music inputs
        env:
          ROM_URL: ${{ secrets.DAYTONA93_DROPBOX_URL }}
          EXTRA_ROM_URL: ${{ secrets.DAYTONAZIP_DROPBOX_URL }}
          MUSIC_URL: ${{ secrets.DAYTONA_MUSIC_DROPBOX_URL }}
        run: |
          set -euo pipefail
          mkdir -p input
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 600 \
            --output input/daytona93.zip "$ROM_URL"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 600 \
            --output input/daytona-extra.zip "$EXTRA_ROM_URL"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 600 \
            --output input/daytona-music.zip "$MUSIC_URL"
          unzip -tq input/daytona93.zip
          unzip -tq input/daytona-extra.zip
          unzip -tq input/daytona-music.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          required = (
              "epr-16720.7", "epr-16721.8", "mpr-16491.32",
              "mpr-16492.33", "mpr-16493.4", "mpr-16494.5",
          )
          base = Path("input/daytona93.zip")
          extra = Path("input/daytona-extra.zip")
          output = Path("input/daytona93-complete.zip")
          with ZipFile(base) as first, ZipFile(extra) as second, ZipFile(output, "w", ZIP_DEFLATED) as merged:
              base_names = set()
              for info in first.infolist():
                  if info.is_dir():
                      continue
                  name = Path(info.filename).name
                  merged.writestr(name, first.read(info.filename))
                  base_names.add(name)
              # daytona93 is a merged MAME clone set: parent-set ROMs are
              # intentionally omitted from its ZIP. Import every missing parent
              # ROM, not just the six sound-board ROMs.
              added = []
              for info in second.infolist():
                  if info.is_dir():
                      continue
                  name = Path(info.filename).name
                  if name in base_names:
                      continue
                  merged.writestr(name, second.read(info.filename))
                  base_names.add(name)
                  added.append(name)
          with ZipFile(output) as result:
              names = {Path(item).name for item in result.namelist()}
              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit("merged ROM set is missing: " + ", ".join(missing))
              print(f"Combined ROM archive is valid: {len(result.namelist())} files; added {len(added)} parent-set files")
          PY
          echo "All private inputs downloaded and merged on the ephemeral runner."

      - name: Test Naomi ROMFS tooling
        run: python3 platform/naomi/tests/test_romfs_tools.py

      - name: Fetch pinned Daytona host-build dependencies
        run: python3 scripts/setup.py --no-build

      - name: Restore generated Daytona asset cache
        id: asset-cache
        uses: actions/cache/restore@v4
        with:
          path: build/naomi-assets
          key: naomi-assets-${{ runner.os }}-${{ hashFiles('platform/dreamcast-native/**', 'platform/naomi/**', 'scripts/**') }}-${{ hashFiles('input/daytona93-complete.zip', 'input/daytona-music.zip') }}

      - name: Pre-flight Naomi build checks
        env:
          KOS_BASE: ${{ github.workspace }}/KallistiOS
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          command -v sh-elf-gcc >/dev/null
          command -v sh-elf-ld >/dev/null
          test -x "$KOS_BASE/utils/pvrtex/pvrtex" || {
            make -C "$KOS_BASE/utils/pvrtex" -j2
          }
          mkdir -p "$DC_TOOLS_BASE"
          make -C "$KOS_BASE/utils/pvrtex" install
          export PATH="$DC_TOOLS_BASE:$PATH"
          test -x "$DC_TOOLS_BASE/pvrtex"
          grep -q '#include <sh4zam/shz_sh4zam.h>' platform/dreamcast-native/code/render/ui/result_render.c
          find extern -path '*/sh4zam/shz_sh4zam.h' -print -quit | grep -q .
          test -f platform/dreamcast-native/recipes/build_assets.sh
          test -f platform/naomi/tools/append_romfs.py
          test -f platform/naomi/tools/romfsgen.py
          if [ "${{ steps.asset-cache.outputs.cache-hit }}" = "true" ]; then
            test -s build/naomi-assets/make-vars.txt
            echo "Pre-flight passed; compatible generated assets restored from cache."
          else
            echo "Pre-flight passed; asset generation is required."
          fi

      - name: Generate complete Daytona assets
        if: steps.asset-cache.outputs.cache-hit != 'true'
        env:
          KOS_BASE: ${{ github.workspace }}/KallistiOS
          CC: clang
          CXX: clang++
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          # pvrtex is built and checked in the pre-flight step above.
          export PATH="$DC_TOOLS_BASE:$PATH"
          # enDjinn defaults to its developer workstation KOS path; use this runner's KOS checkout.
          sed -i 's|^source /opt/toolchains/dc/kos/environ.sh$|source "$KOS_BASE/environ.sh"|' extern/endjinn/environ.sh
          zsh platform/dreamcast-native/recipes/build_assets.sh \
            input/daytona93-complete.zip build/naomi-assets \
            --music input/daytona-music.zip --jobs 2

      - name: Save generated Daytona asset cache
        if: steps.asset-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: build/naomi-assets
          key: naomi-assets-${{ runner.os }}-${{ hashFiles('platform/dreamcast-native/**', 'platform/naomi/**', 'scripts/**') }}-${{ hashFiles('input/daytona93-complete.zip', 'input/daytona-music.zip') }}

      - name: Compile Naomi game and append resident ROMFS
        env:
          KOS_BASE: ${{ github.workspace }}/KallistiOS
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          mapfile -t MAKE_VARS < <(grep -v '^#' build/naomi-assets/make-vars.txt)
          make -C platform/dreamcast-native \
            "${MAKE_VARS[@]}" \
            NATIVE_RESIDENT_CAR=1 NATIVE_FRAME_PROFILE=1 NATIVE_HANDOPT=1 \
            RACE_TICK_LIMIT=0 \
            ENJ_BUILDDIR="$GITHUB_WORKSPACE/build/naomi-game/obj" \
            ENJ_BINDIR="$GITHUB_WORKSPACE/build/naomi-game/bin" \
            -j2 naomi-bin
          mapfile -t IMAGES < <(find build/naomi-game/bin -maxdepth 1 -type f -name '*.naomi.bin' -print)
          test "${#IMAGES[@]}" -eq 1 || {
            echo "::error::Expected exactly one final Naomi .bin; found ${#IMAGES[@]}."
            exit 1
          }
          python3 - "${IMAGES[0]}" <<'PY'
          import sys
          from pathlib import Path
          image = Path(sys.argv[1])
          size = image.stat().st_size
          if size == 0 or size > 0x10000000 or size % 1024:
              raise SystemExit(f"invalid final image size/alignment: {size}")
          with image.open("rb") as stream:
              if stream.read(6) != b"NAOMI ":
                  raise SystemExit("final image does not have a Naomi ROM signature")
          print(f"Validated self-contained Naomi NetDIMM image: {size} bytes")
          PY

      - name: Encrypt final image for private delivery
        env:
          NAOMI_ARTIFACT_PASSWORD: ${{ secrets.NAOMI_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/private-release
          mapfile -t IMAGES < <(find build/naomi-game/bin -maxdepth 1 -type f -name '*.naomi.bin' -print)
          test "${#IMAGES[@]}" -eq 1
          python3 platform/naomi/tools/secure_artifact.py \
            --encrypt "${IMAGES[0]}" \
            --output build/private-release/daytona-naomi-netdimm.bin.enc
          cp platform/naomi/tools/secure_artifact.py build/private-release/
          cat > build/private-release/README.txt <<'EOF'
          Daytona USA Naomi NetDIMM image (encrypted)

          1. Install Python 3 and the cryptography package:
             python -m pip install cryptography
          2. Run:
             python secure_artifact.py --decrypt daytona-naomi-netdimm.bin.enc --output daytona-naomi-netdimm.bin
          3. Enter the NAOMI_ARTIFACT_PASSWORD you saved in your GitHub repository secrets.

          The decrypted .bin is the self-contained NetDIMM image for your existing uploader.
          EOF
          unset NAOMI_ARTIFACT_PASSWORD

      - name: Upload encrypted NetDIMM image
        uses: actions/upload-artifact@v4
        with:
          name: daytona-naomi-netdimm-encrypted
          path: build/private-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Build summary
        run: |
          {
            echo "## Naomi NetDIMM build completed"
            echo
            echo "The self-contained image was generated and uploaded encrypted."
            echo "The public repository artifact does not contain the plaintext ROM-derived game image."
            echo "Download artifact: daytona-naomi-netdimm-encrypted (expires in 3 days)."
          } >> "$GITHUB_STEP_SUMMARY"
