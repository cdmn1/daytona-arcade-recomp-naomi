name: Naomi probe binaries

on:
  push:
    branches: [naomi]
    paths:
      - 'platform/naomi/code/**'
      - 'platform/naomi/include/**'
      - 'platform/naomi/tests/input_probe/**'
      - 'platform/naomi/tools/**'
      - 'platform/dreamcast-native/Makefile'
      - 'platform/dreamcast-native/local.cfg.mk'
      - '.github/workflows/naomi-probes.yml'
  workflow_dispatch:

concurrency:
  group: naomi-probes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out Daytona project
        uses: actions/checkout@v4

      - name: Check out current KallistiOS
        uses: actions/checkout@v4
        with:
          repository: KallistiOS/KallistiOS
          ref: master
          path: KallistiOS

      - name: Install KOS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex texinfo gettext \
            libjpeg-dev libpng-dev libelf-dev \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            zlib1g-dev libncurses-dev pkg-config \
            git subversion python3 wget curl

      - name: Restore SH-4 toolchain cache
        id: sh-toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain/sh-elf
          key: sh-elf-gcc15-stable-${{ runner.os }}-naomi-v1

      - name: Build SH-4 toolchain if cache is empty
        env:
          KOS_BASE: ${{ github.workspace }}/KallistiOS
          KOS_CC_BASE: ${{ github.workspace }}/.toolchain/sh-elf
        run: |
          mkdir -p "$KOS_CC_BASE"
          if [ ! -x "$KOS_CC_BASE/bin/sh-elf-gcc" ]; then
            cp "$KOS_BASE/utils/kos-chain/Makefile.dreamcast.cfg" \
               "$KOS_BASE/utils/kos-chain/Makefile.cfg"
            sed -i \
              -e "s|^toolchain_path=.*|toolchain_path=$KOS_CC_BASE|" \
              -e 's|^makejobs=.*|makejobs=4|' \
              -e 's|^enable_objc=.*|enable_objc=0|' \
              -e 's|^enable_objcpp=.*|enable_objcpp=0|' \
              -e 's|^precision_modes=.*|precision_modes=m4-single|' \
              "$KOS_BASE/utils/kos-chain/Makefile.cfg"
            make -C "$KOS_BASE/utils/kos-chain"
          fi

      - name: Configure and build KOS for Naomi
        env:
          KOS_BASE: ${{ github.workspace }}/KallistiOS
        run: |
          mkdir -p "$GITHUB_WORKSPACE/kos-ports/include" \
                   "$GITHUB_WORKSPACE/kos-ports/lib"
          cat > "$KOS_BASE/environ.sh" <<'EOF'
          export KOS_TOOLCHAIN="gcc"
          export KOS_ARCH="dreamcast"
          export KOS_SUBARCH="naomi"
          export KOS_BASE="${GITHUB_WORKSPACE}/KallistiOS"
          export KOS_PORTS="${GITHUB_WORKSPACE}/kos-ports"
          export KOS_CC_BASE="${GITHUB_WORKSPACE}/.toolchain/sh-elf"
          export KOS_CC_PREFIX="sh-elf"
          export DC_ARM_BASE="${GITHUB_WORKSPACE}/.toolchain/arm-eabi"
          export DC_ARM_PREFIX="arm-eabi"
          export DC_TOOLS_BASE="${GITHUB_WORKSPACE}/.toolchain/bin"
          export KOS_GENROMFS="${KOS_BASE}/utils/genromfs/genromfs"
          export KOS_CMAKE_TOOLCHAIN="${KOS_BASE}/utils/cmake/kallistios.toolchain.cmake"
          export KOS_MAKE="make"
          export KOS_CFLAGS="-O2 -fno-PIC -fno-PIE -fomit-frame-pointer"
          export KOS_SH4_PRECISION="-m4-single"
          . "${KOS_BASE}/env/environ_base.sh"
          EOF
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          make -C "$KOS_BASE" -j2
          make -C "$GITHUB_WORKSPACE/platform/naomi/tests/input_probe" clean rom

      - name: Upload Naomi probe binaries
        uses: actions/upload-artifact@v4
        with:
          name: naomi-netdimm-probes
          if-no-files-found: error
          path: |
            platform/naomi/tests/input_probe/naomi_input_probe_v4.bin
